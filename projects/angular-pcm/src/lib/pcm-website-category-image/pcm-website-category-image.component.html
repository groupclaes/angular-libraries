@if (newPage) {
  <div id="categories-list-paged" class="categories-list">
    @for (category of categories; track category) {
      <a [href]="category.href" target="_blank" class="container">
        <div class="content" [style]="category.css">
          <div [ngClass]="labelClass">
            <h4 [innerText]="category.name[culture].toLowerCase()"></h4>
          </div>
        </div>
      </a>
    }
  </div>
}
@if (link) {
  <div id="categories-list-linked" class="categories-list">
    @for (category of categories; track category) {
      <a [routerLink]="['/products', category.name[culture].toLowerCase()]"
        [queryParams]="{id: category.id}" class="container">
        <div class="content" [style]="category.css">
          <div [ngClass]="labelClass">
            <h4 [innerText]="category.name[culture].toLowerCase()"></h4>
          </div>
        </div>
      </a>
    }
  </div>
}
