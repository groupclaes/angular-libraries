@for (slide of slides; track slide) {
  <a class="slides" [title]="slide.title" rel="noopener noreferer" target="_blank" [attr.href]="slide.href"
  [ngClass]="slide.state" [style]="slide.css"></a>
}

<div class="bottom-container" (window:resize)="onResize()">
  @if (description) {
    <h2 [innerText]="description"></h2>
  }
  @if (slideCount > 1) {
    <div class="slide-selectors">
      @for (slide of slides; track slide; let index = $index) {
        <div class="slide-selector" [ngClass]="{ selected: index === currentIndex }"
          (click)="selectIndex(index)">
          <i class="far fa-fw fa-circle fa-sm"></i>
        </div>
      }
    </div>
  }
</div>
